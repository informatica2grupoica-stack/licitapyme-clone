# docker-compose.yml — Despliegue en el NOTEBOOK chileno (siempre encendido).
#
#   • app         → la app Next.js completa (front + API + descargador con Chromium).
#                   Sale a Mercado Público por la IP chilena del notebook → el descargador funciona.
#   • cloudflared → túnel de Cloudflare: publica la app en un link HTTPS público
#                   (https://app-licita.tudominio.com) sin abrir puertos del router.
#
# Uso EN EL NOTEBOOK:
#   1. cp .env.example .env   y rellena los valores reales (incluido CLOUDFLARE_TUNNEL_TOKEN).
#   2. docker compose up -d --build
#   3. Ver logs:  docker compose logs -f
#   4. Apagar:    docker compose down
#
# docker-compose lee automáticamente el archivo .env de esta carpeta tanto para
# sustituir ${VARIABLE} aquí (build args) como para inyectarlas al contenedor (env_file).
services:
  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* deben existir EN BUILD (se incrustan en el bundle del front).
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_AUTOMATIZACION_PAUSADA: ${NEXT_PUBLIC_AUTOMATIZACION_PAUSADA}
    image: licitapyme-local
    container_name: licitapyme
    restart: unless-stopped          # vuelve solo tras reinicio/caída del notebook
    init: true                       # tini como PID 1: cosecha los procesos zombie de Chromium
    env_file: .env                   # inyecta TODAS las variables al runtime del contenedor
    ports:
      - "3003:3000"                  # opcional: probar en el propio notebook (http://localhost:3003)

  # Scheduler: dispara intake (cada 4h), prefiltro (+1h) y reintento de descarga de
  # documentos de Negocios (cada 2h) contra la app INTERNA (http://app:3000) con CRON_SECRET.
  # Vive en el notebook (IP chilena) porque la descarga sale a Mercado Público. Sobrevive
  # reinicios (restart: unless-stopped). Ver scheduler/scheduler.mjs para la agenda.
  scheduler:
    build:
      context: ./scheduler
    image: licitapyme-scheduler
    container_name: licitapyme-scheduler
    restart: unless-stopped
    env_file: .env                   # aporta CRON_SECRET y NEXT_PUBLIC_AUTOMATIZACION_PAUSADA
    environment:
      SCHEDULER_APP_URL: http://app:3000
      TZ: America/Santiago
    depends_on:
      - app

  # Convierte .doc (Word 97-2003) a .docx con LibreOffice headless, para los anexos de
  # oferente que vienen en formato viejo (la app no puede instalar LibreOffice en su propia
  # imagen sin inflarla — mejor un contenedor aparte). SIN "ports:" a propósito: "app" y
  # "conversor-doc" viven en la misma red interna de este compose (igual que "app" y
  # "scheduler"), así que se llegan por nombre de servicio — http://conversor-doc:8091 — sin
  # exponer nada al público ni pasar por Caddy/Cloudflare.
  conversor-doc:
    build:
      context: ./conversor-doc
    image: licitapyme-conversor-doc
    container_name: licitapyme-conversor-doc
    restart: unless-stopped
    environment:
      CONVERSOR_SECRET: ${CONVERSOR_SECRET}
      TZ: America/Santiago
    depends_on:
      - app

  # Base de datos PROPIA en el VPS (reemplaza a la de Bluehost, que queda de respaldo nocturno).
  # Va en el perfil "db": NO se levanta hasta poner COMPOSE_PROFILES=db en el .env, así un deploy
  # normal no la arranca antes del corte. Guía completa: docs/migracion-bd-vps.md.
  # Ajustes copiados de Bluehost (MySQL 5.7) para que la app se comporte igual en 8.0:
  #   • sql_mode sin STRICT ni ONLY_FULL_GROUP_BY (en Bluehost: NO_ENGINE_SUBSTITUTION).
  #   • collation utf8mb4_general_ci: sin esto, las tablas nuevas nacen en utf8mb4_0900_ai_ci y los
  #     JOIN contra las viejas fallan con «Illegal mix of collations».
  #   • TZ America/Denver: Bluehost corre en MDT y 75 columnas guardan CURRENT_TIMESTAMP en esa hora;
  #     cambiar la zona mezclaría fechas viejas y nuevas. La app ya no usa NOW() para nada chileno.
  db:
    image: mysql:8.0
    container_name: licitapyme-db
    restart: unless-stopped
    profiles: ["db"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: America/Denver
    command:
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit-defaults-for-timestamp=OFF
      - --innodb-strict-mode=OFF
      - --innodb-buffer-pool-size=768M
      - --max-allowed-packet=256M
      - --max-connections=100
      - --skip-name-resolve
      - --skip-log-bin                 # sin réplicas no sirve: solo frena la importación y llena el disco (8.0 lo trae encendido)
    volumes:
      - mysql-datos:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"        # solo el propio VPS (y túnel SSH desde el PC); nunca público

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: licitapyme-tunnel
    restart: unless-stopped
    # QUICK TUNNEL (gratis, sin dominio ni token). Cloudflare genera una URL pública
    # aleatoria https://<algo>.trycloudflare.com. Aparece en los logs del contenedor:
    #   docker compose logs cloudflared   → busca la línea "trycloudflare.com"
    # ⚠️ La URL cambia en cada reinicio del contenedor. Para un link fijo se necesita
    #    un dominio en Cloudflare (modo túnel con nombre + token).
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app

volumes:
  mysql-datos:                     # datos de MySQL; sobreviven a «docker compose down» y a los deploy
