<!doctype html><meta charset="utf-8"><title>PuenteLoader</title>
<style>
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f172a80;display:flex;align-items:center;justify-content:center;height:100vh;
background-image:linear-gradient(rgba(15,23,42,.5),rgba(15,23,42,.5)),repeating-linear-gradient(45deg,#e2e8f0 0 12px,#f1f5f9 12px 24px);}
.caja{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:32px 36px;display:flex;flex-direction:column;align-items:center}
@keyframes puenteCruza{0%{opacity:0;transform:translate(14px,4px) rotate(-6deg)}10%{opacity:1;transform:translate(22px,0) rotate(-4deg)}50%{opacity:1;transform:translate(72px,-5px) rotate(3deg)}88%{opacity:1;transform:translate(122px,0) rotate(0)}100%{opacity:0;transform:translate(134px,4px) rotate(0)}}
@keyframes puenteRecibe{0%,78%{transform:scaleY(1);opacity:.9}88%{transform:scaleY(1.18);opacity:1}100%{transform:scaleY(1);opacity:.9}}
@keyframes puenteCable{0%,100%{stroke-dashoffset:0;opacity:.55}50%{stroke-dashoffset:-12;opacity:.95}}
.puente{position:relative;width:160px;height:96px;zoom:2.6}
.puente-svg{position:absolute;inset:0;width:100%;height:100%}
.puente-carta{position:absolute;top:37px;left:0;width:11px;height:14px;border-radius:3px;background:#fff;border:1.5px solid #c7d2fe;box-shadow:0 3px 8px rgba(79,70,229,.18);animation:puenteCruza 2.6s ease-in-out infinite}
.puente-carta-2{animation-delay:.55s}.puente-carta-3{animation-delay:1.1s}
.puente-destino{transform-origin:bottom center;animation:puenteRecibe 2.6s ease-in-out infinite}
.puente-cable{stroke-dasharray:4 4;animation:puenteCable 2.6s linear infinite}
.t{font-size:22px;font-weight:700;color:#4f46e5;margin:4px 0 0;line-height:1}
.s{font-size:14px;font-weight:600;color:#334155;margin:8px 0 0}
.u{font-size:12px;color:#94a3b8;margin:4px 0 0;text-align:center;max-width:20rem}
</style>
<div class="caja">
<div class="puente">
<svg class="puente-svg" viewBox="0 0 160 96" fill="none">
<rect x="0" y="48" width="26" height="30" rx="6" fill="#e2e8f0"/><rect x="6" y="42" width="14" height="8" rx="3" fill="#cbd5e1"/>
<g class="puente-destino"><rect x="134" y="48" width="26" height="30" rx="6" fill="#c7d2fe"/><circle cx="141" cy="40" r="4.5" fill="#6366f1"/><circle cx="152" cy="40" r="4.5" fill="#818cf8"/></g>
<rect x="46" y="12" width="4" height="42" rx="2" fill="#94a3b8"/><rect x="110" y="12" width="4" height="42" rx="2" fill="#94a3b8"/>
<path d="M16 24 C 32 18, 42 14, 48 14 C 74 14, 86 32, 112 14 C 118 14, 128 18, 144 24" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
<g class="puente-cable" stroke="#c7d2fe" stroke-width="1.4" stroke-linecap="round"><line x1="60" y1="17" x2="60" y2="52"/><line x1="72" y1="20" x2="72" y2="52"/><line x1="88" y1="21" x2="88" y2="52"/><line x1="100" y1="18" x2="100" y2="52"/></g>
<rect x="14" y="52" width="132" height="6" rx="3" fill="#cbd5e1"/><rect x="14" y="52" width="132" height="2" rx="1" fill="#e2e8f0"/>
</svg>
<span class="puente-carta"></span><span class="puente-carta puente-carta-2"></span><span class="puente-carta puente-carta-3"></span>
</div>
<p class="t">24</p><p class="s">Cruzando al puente…</p>
<p class="u">Quedan esperando reparto. Todavía no se asigna ninguna a un perfil.</p>
</div>
