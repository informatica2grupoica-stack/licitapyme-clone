<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Sustitución de "Garamond" (caso real: 2905-36-LR26, Municipalidad de Lanco, "Formulario 1 -
  Identificación Oferente.docx" — reportado por el usuario con captura: la letra sale más grande
  y "FIRMA OFERENTE" se corta distinto al original). El .docx pide Garamond (rFonts ascii/hAnsi=
  "Garamond"), una fuente de Microsoft Office que el contenedor no tiene — LibreOffice cae a su
  sustituto genérico de serif (DejaVu Serif/Liberation Serif), que es más ANCHO que Garamond, así
  que el texto ocupa más espacio y se corta en un lugar distinto al que el organismo ve en Word.

  A diferencia de Arial/Calibri/Cambria (que sí tienen clones MÉTRICOS exactos — Liberation Sans/
  Carlito/Caladea, ver el comentario del Dockerfile), no existe un clon métrico de Garamond
  empaquetado en Debian: "Garamond" no es un único diseño estándar (hay Adobe Garamond, ITC
  Garamond, Garamond Premier, Monotype Garamond del propio Office...), cada uno con métricas algo
  distintas. "EB Garamond" (fonts-ebgaramond) es la mejor alternativa disponible — mismo espíritu
  tipográfico (un garalde clásico, angosto), mucho más parecida en ancho que el serif genérico al
  que LibreOffice cae por defecto — pero NO es un clon exacto carácter por carácter, así que el
  corte de línea puede seguir sin ser IDÉNTICO al de Word con la fuente Garamond real instalada.
  Sin este alias, LibreOffice ni siquiera prueba EB Garamond (el nombre de familia no calza con
  "Garamond" por sustring): hay que decírselo explícitamente acá.
-->
<fontconfig>
  <alias>
    <family>Garamond</family>
    <prefer>
      <family>EB Garamond</family>
    </prefer>
  </alias>
</fontconfig>
